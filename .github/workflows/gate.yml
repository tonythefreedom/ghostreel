name: gate
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the boundary test reads commit messages too
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run gate
        env:
          GHOSTREEL_OFFLINE: "1"
